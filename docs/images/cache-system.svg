<svg width="800" height="550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cacheGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cacheGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#48bb78;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38a169;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cacheGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f6ad55;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ed8936;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowCache" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a5568" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2d3748" text-anchor="middle">
    三层缓存系统架构 Three-Tier Cache System
  </text>

  <!-- Request Entry -->
  <g transform="translate(325, 70)">
    <ellipse cx="75" cy="20" rx="75" ry="20" fill="#4299e1" opacity="0.9"/>
    <text x="75" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      渲染请求 Request
    </text>
  </g>

  <line x1="400" y1="90" x2="400" y2="120" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowCache)"/>

  <!-- Cache Manager -->
  <g transform="translate(280, 120)">
    <rect width="240" height="60" rx="8" fill="url(#cacheGrad1)" opacity="0.9"/>
    <text x="120" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
      缓存管理器
    </text>
    <text x="120" y="48" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">
      Cache Manager
    </text>
  </g>

  <line x1="400" y1="180" x2="400" y2="210" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowCache)"/>

  <!-- L1: RAM Cache -->
  <g transform="translate(50, 210)">
    <rect width="200" height="100" rx="8" fill="url(#cacheGrad2)" opacity="0.9"/>
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
      L1: RAM 缓存
    </text>
    <text x="100" y="43" font-family="Arial, sans-serif" font-size="11" fill="#c6f6d5" text-anchor="middle">
      RAM Cache
    </text>

    <text x="100" y="63" font-family="Arial, sans-serif" font-size="10" fill="#f0fff4" text-anchor="middle">
      • 实时帧缓存
    </text>
    <text x="100" y="78" font-family="Arial, sans-serif" font-size="10" fill="#f0fff4" text-anchor="middle">
      • LRU 算法
    </text>
    <text x="100" y="93" font-family="Arial, sans-serif" font-size="10" fill="#f0fff4" text-anchor="middle">
      • 容量: 2GB
    </text>
  </g>

  <!-- L2: Disk Cache -->
  <g transform="translate(300, 210)">
    <rect width="200" height="100" rx="8" fill="url(#cacheGrad3)" opacity="0.9"/>
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
      L2: 磁盘缓存
    </text>
    <text x="100" y="43" font-family="Arial, sans-serif" font-size="11" fill="#fffaf0" text-anchor="middle">
      Disk Cache
    </text>

    <text x="100" y="63" font-family="Arial, sans-serif" font-size="10" fill="#ffefd5" text-anchor="middle">
      • 预渲染结果
    </text>
    <text x="100" y="78" font-family="Arial, sans-serif" font-size="10" fill="#ffefd5" text-anchor="middle">
      • 压缩存储
    </text>
    <text x="100" y="93" font-family="Arial, sans-serif" font-size="10" fill="#ffefd5" text-anchor="middle">
      • 容量: 50GB
    </text>
  </g>

  <!-- L3: Network Cache -->
  <g transform="translate(550, 210)">
    <rect width="200" height="100" rx="8" fill="#9f7aea" opacity="0.9"/>
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
      L3: 网络缓存
    </text>
    <text x="100" y="43" font-family="Arial, sans-serif" font-size="11" fill="#e9d8fd" text-anchor="middle">
      Network Cache
    </text>

    <text x="100" y="63" font-family="Arial, sans-serif" font-size="10" fill="#faf5ff" text-anchor="middle">
      • 分布式存储
    </text>
    <text x="100" y="78" font-family="Arial, sans-serif" font-size="10" fill="#faf5ff" text-anchor="middle">
      • 渲染农场
    </text>
    <text x="100" y="93" font-family="Arial, sans-serif" font-size="10" fill="#faf5ff" text-anchor="middle">
      • 容量: 无限
    </text>
  </g>

  <!-- Arrows from manager to caches -->
  <line x1="340" y1="180" x2="150" y2="210" stroke="#48bb78" stroke-width="2" marker-end="url(#arrowCache)"/>
  <line x1="400" y1="180" x2="400" y2="210" stroke="#ed8936" stroke-width="2" marker-end="url(#arrowCache)"/>
  <line x1="460" y1="180" x2="650" y2="210" stroke="#9f7aea" stroke-width="2" marker-end="url(#arrowCache)"/>

  <!-- Cache Miss Flow -->
  <g transform="translate(50, 340)">
    <rect width="700" height="140" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="2"/>
    <text x="350" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2d3748" text-anchor="middle">
      缓存未命中流程 Cache Miss Flow
    </text>

    <!-- Step 1 -->
    <g transform="translate(20, 40)">
      <rect width="120" height="50" rx="6" fill="#ef4444" opacity="0.9"/>
      <text x="60" y="25" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">
        L1 Miss
      </text>
      <text x="60" y="40" font-family="Arial, sans-serif" font-size="9" fill="#fee2e2" text-anchor="middle">
        RAM 未命中
      </text>
    </g>

    <line x1="140" y1="65" x2="170" y2="65" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowCache)"/>
    <text x="155" y="60" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">→</text>

    <!-- Step 2 -->
    <g transform="translate(170, 40)">
      <rect width="120" height="50" rx="6" fill="#f59e0b" opacity="0.9"/>
      <text x="60" y="25" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">
        Check L2
      </text>
      <text x="60" y="40" font-family="Arial, sans-serif" font-size="9" fill="#fef3c7" text-anchor="middle">
        查询磁盘缓存
      </text>
    </g>

    <line x1="290" y1="65" x2="320" y2="65" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowCache)"/>
    <text x="305" y="60" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">→</text>

    <!-- Step 3 -->
    <g transform="translate(320, 40)">
      <rect width="120" height="50" rx="6" fill="#8b5cf6" opacity="0.9"/>
      <text x="60" y="25" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">
        Check L3
      </text>
      <text x="60" y="40" font-family="Arial, sans-serif" font-size="9" fill="#ede9fe" text-anchor="middle">
        查询网络缓存
      </text>
    </g>

    <line x1="440" y1="65" x2="470" y2="65" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowCache)"/>
    <text x="455" y="60" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">→</text>

    <!-- Step 4 -->
    <g transform="translate(470, 40)">
      <rect width="120" height="50" rx="6" fill="#6366f1" opacity="0.9"/>
      <text x="60" y="25" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">
        Render
      </text>
      <text x="60" y="40" font-family="Arial, sans-serif" font-size="9" fill="#e0e7ff" text-anchor="middle">
        执行渲染
      </text>
    </g>

    <line x1="590" y1="65" x2="620" y2="65" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowCache)"/>
    <text x="605" y="60" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">→</text>

    <!-- Step 5 -->
    <g transform="translate(620, 40)">
      <rect width="60" height="50" rx="6" fill="#10b981" opacity="0.9"/>
      <text x="30" y="25" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">
        Save
      </text>
      <text x="30" y="40" font-family="Arial, sans-serif" font-size="9" fill="#d1fae5" text-anchor="middle">
        保存
      </text>
    </g>

    <!-- Return arrow -->
    <line x1="620" y1="100" x2="20" y2="100" stroke="#10b981" stroke-width="2" stroke-dasharray="5,5"/>
    <polygon points="20,100 30,95 30,105" fill="#10b981"/>
    <text x="320" y="118" font-family="Arial, sans-serif" font-size="10" fill="#10b981" text-anchor="middle">
      结果返回并保存到各级缓存
    </text>
  </g>

  <!-- Cache Hit Stats -->
  <g transform="translate(50, 500)">
    <rect width="700" height="40" rx="6" fill="#edf2f7"/>

    <text x="20" y="25" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2d3748">
      典型命中率:
    </text>

    <circle cx="140" cy="20" r="4" fill="#48bb78"/>
    <text x="150" y="25" font-family="Arial, sans-serif" font-size="10" fill="#4a5568">
      L1 (RAM): 85%
    </text>

    <circle cx="280" cy="20" r="4" fill="#f6ad55"/>
    <text x="290" y="25" font-family="Arial, sans-serif" font-size="10" fill="#4a5568">
      L2 (Disk): 12%
    </text>

    <circle cx="420" cy="20" r="4" fill="#9f7aea"/>
    <text x="430" y="25" font-family="Arial, sans-serif" font-size="10" fill="#4a5568">
      L3 (Network): 2%
    </text>

    <circle cx="580" cy="20" r="4" fill="#ef4444"/>
    <text x="590" y="25" font-family="Arial, sans-serif" font-size="10" fill="#4a5568">
      Miss (Render): 1%
    </text>
  </g>
</svg>
