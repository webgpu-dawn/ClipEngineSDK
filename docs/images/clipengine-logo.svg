<svg width="400" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: Film strip with GPU acceleration symbol -->
  <g transform="translate(20, 20)">
    <!-- Film strip -->
    <rect x="0" y="10" width="60" height="40" rx="4" fill="url(#gradient1)" opacity="0.9"/>
    <rect x="5" y="15" width="50" height="30" fill="#ffffff" opacity="0.2"/>

    <!-- Film perforations -->
    <rect x="2" y="12" width="4" height="4" fill="#ffffff" opacity="0.5"/>
    <rect x="2" y="44" width="4" height="4" fill="#ffffff" opacity="0.5"/>
    <rect x="54" y="12" width="4" height="4" fill="#ffffff" opacity="0.5"/>
    <rect x="54" y="44" width="4" height="4" fill="#ffffff" opacity="0.5"/>

    <!-- GPU acceleration symbol (lightning bolt) -->
    <path d="M 40 18 L 32 30 L 38 30 L 34 42 L 46 28 L 40 28 Z" fill="url(#gradient2)" opacity="0.95"/>

    <!-- Render layers representation -->
    <rect x="10" y="22" width="15" height="2" fill="#ffffff" opacity="0.6"/>
    <rect x="10" y="27" width="15" height="2" fill="#ffffff" opacity="0.6"/>
    <rect x="10" y="32" width="15" height="2" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Text: ClipEngine -->
  <text x="100" y="50" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#2d3748">
    ClipEngine
  </text>

  <!-- Tagline -->
  <text x="100" y="75" font-family="Arial, sans-serif" font-size="14" fill="#718096">
    Professional GPU-Accelerated Rendering Engine
  </text>

  <!-- Version badge -->
  <g transform="translate(100, 85)">
    <rect width="60" height="20" rx="10" fill="url(#gradient1)"/>
    <text x="30" y="14" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">
      v1.0
    </text>
  </g>
</svg>
