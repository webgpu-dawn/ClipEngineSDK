<svg width="700" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="demoGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="demoGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="400" fill="#0f172a"/>

  <!-- Title -->
  <text x="350" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0" text-anchor="middle">
    合成系统演示 Composition Demo
  </text>

  <!-- Main composition area -->
  <rect x="50" y="60" width="600" height="280" rx="8" fill="#1e293b"/>

  <!-- Layer 1: Background (bottom) -->
  <g opacity="0.8">
    <rect x="70" y="250" width="560" height="70" rx="4" fill="#48bb78"/>
    <text x="100" y="290" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">图层 1: 背景 (Background)</text>
  </g>

  <!-- Layer 2: Video (middle) -->
  <g opacity="0.9">
    <rect x="90" y="180" width="520" height="90" rx="4" fill="url(#demoGrad1)"/>
    <text x="120" y="230" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">图层 2: 视频 (Video Layer)</text>
    <!-- Animated effect indicator -->
    <circle cx="550" cy="225" r="8" fill="#fbbf24">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="565" y="230" font-family="Arial, sans-serif" font-size="11" fill="#fbbf24">效果</text>
  </g>

  <!-- Layer 3: Text overlay (top) -->
  <g>
    <rect x="110" y="100" width="480" height="100" rx="4" fill="url(#demoGrad2)" opacity="0.7"/>
    <text x="350" y="140" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
      CLIPENGINE
    </text>
    <text x="350" y="165" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" opacity="0.8">
      Professional Rendering Engine
    </text>
    <!-- Transform indicator -->
    <circle cx="570" cy="150" r="8" fill="#4299e1">
      <animate attributeName="r" values="8;12;8" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="585" y="155" font-family="Arial, sans-serif" font-size="11" fill="#4299e1">变换</text>
  </g>

  <!-- Blend mode indicator -->
  <g transform="translate(140, 90)">
    <rect width="80" height="20" rx="10" fill="#9f7aea" opacity="0.9"/>
    <text x="40" y="14" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">混合: 正常</text>
  </g>

  <!-- Opacity indicator -->
  <g transform="translate(490, 90)">
    <rect width="80" height="20" rx="10" fill="#f6ad55" opacity="0.9"/>
    <text x="40" y="14" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">透明度: 70%</text>
  </g>

  <!-- Bottom info bar -->
  <rect x="50" y="350" width="600" height="40" rx="8" fill="#1e293b"/>

  <!-- Feature highlights -->
  <g transform="translate(80, 365)">
    <circle cx="0" cy="5" r="5" fill="#48bb78"/>
    <text x="12" y="10" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">多图层合成</text>

    <circle cx="120" cy="5" r="5" fill="#4299e1"/>
    <text x="132" y="10" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">实时预览</text>

    <circle cx="220" cy="5" r="5" fill="#f6ad55"/>
    <text x="232" y="10" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">效果链</text>

    <circle cx="300" cy="5" r="5" fill="#fc8181"/>
    <text x="312" y="10" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">混合模式</text>

    <circle cx="390" cy="5" r="5" fill="#9f7aea"/>
    <text x="402" y="10" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">蒙版支持</text>

    <circle cx="480" cy="5" r="5" fill="#fbbf24"/>
    <text x="492" y="10" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">GPU 加速</text>
  </g>

  <!-- Note about GIF -->
  <text x="350" y="395" font-family="Arial, sans-serif" font-size="10" fill="#718096" text-anchor="middle" opacity="0.7">
    📹 此为静态示意图 • 实际 GIF 演示需要录制程序运行画面
  </text>
</svg>
