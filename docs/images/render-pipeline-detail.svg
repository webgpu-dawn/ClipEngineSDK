<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="renderGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="renderGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#48bb78;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38a169;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="renderGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f6ad55;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ed8936;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowRender" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a5568" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="30" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2d3748" text-anchor="middle">
    渲染管线详细流程 Render Pipeline Detail
  </text>

  <!-- Start -->
  <g transform="translate(380, 60)">
    <ellipse cx="70" cy="20" rx="70" ry="20" fill="#4299e1" opacity="0.9"/>
    <text x="70" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      开始渲染 Start
    </text>
  </g>

  <line x1="450" y1="80" x2="450" y2="110" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowRender)"/>

  <!-- Preprocess -->
  <g transform="translate(340, 110)">
    <rect width="220" height="50" rx="8" fill="url(#renderGrad1)" opacity="0.9"/>
    <text x="110" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      预处理 Preprocess
    </text>
    <text x="110" y="40" font-family="Arial, sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">
      初始化渲染上下文 • 资源检查
    </text>
  </g>

  <line x1="450" y1="160" x2="450" y2="190" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowRender)"/>

  <!-- Load Assets -->
  <g transform="translate(340, 190)">
    <rect width="220" height="50" rx="8" fill="url(#renderGrad1)" opacity="0.9"/>
    <text x="110" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      加载资源 Load Assets
    </text>
    <text x="110" y="40" font-family="Arial, sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">
      从磁盘/缓存加载素材
    </text>
  </g>

  <line x1="450" y1="240" x2="450" y2="270" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowRender)"/>

  <!-- Decode Media -->
  <g transform="translate(340, 270)">
    <rect width="220" height="50" rx="8" fill="url(#renderGrad1)" opacity="0.9"/>
    <text x="110" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      解码媒体 Decode Media
    </text>
    <text x="110" y="40" font-family="Arial, sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">
      视频帧解码 • 图像解压
    </text>
  </g>

  <line x1="450" y1="320" x2="450" y2="350" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowRender)"/>

  <!-- Layer Render Loop -->
  <g transform="translate(300, 350)">
    <rect width="300" height="240" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="2"/>
    <text x="150" y="25" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2d3748" text-anchor="middle">
      图层渲染循环 Layer Render Loop
    </text>

    <!-- Apply Transform -->
    <g transform="translate(40, 40)">
      <rect width="220" height="40" rx="6" fill="url(#renderGrad2)" opacity="0.9"/>
      <text x="110" y="18" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">应用变换 Apply Transform</text>
      <text x="110" y="32" font-family="Arial, sans-serif" font-size="9" fill="#c6f6d5" text-anchor="middle">位置 • 旋转 • 缩放 • 锚点</text>
    </g>

    <line x1="150" y1="80" x2="150" y2="95" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowRender)"/>

    <!-- Apply Mask -->
    <g transform="translate(40, 95)">
      <rect width="220" height="40" rx="6" fill="url(#renderGrad2)" opacity="0.9"/>
      <text x="110" y="18" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">应用蒙版 Apply Mask</text>
      <text x="110" y="32" font-family="Arial, sans-serif" font-size="9" fill="#c6f6d5" text-anchor="middle">矢量蒙版 • 轨道遮罩 • Alpha</text>
    </g>

    <line x1="150" y1="135" x2="150" y2="150" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowRender)"/>

    <!-- Apply Effects -->
    <g transform="translate(40, 150)">
      <rect width="220" height="40" rx="6" fill="url(#renderGrad2)" opacity="0.9"/>
      <text x="110" y="18" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">应用效果链 Apply Effects</text>
      <text x="110" y="32" font-family="Arial, sans-serif" font-size="9" fill="#c6f6d5" text-anchor="middle">色彩 • 模糊 • 扭曲 • 风格化</text>
    </g>

    <line x1="150" y1="190" x2="150" y2="205" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowRender)"/>

    <!-- Composite -->
    <g transform="translate(40, 205)">
      <rect width="220" height="30" rx="6" fill="url(#renderGrad3)" opacity="0.9"/>
      <text x="110" y="20" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">合成混合 Composite</text>
    </g>
  </g>

  <!-- Cache Check (side branch) -->
  <g transform="translate(650, 450)">
    <path d="M 0,0 L 120,0 L 150,30 L 120,60 L 0,60 Z" fill="#fbbf24" opacity="0.9"/>
    <text x="75" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#744210" text-anchor="middle">
      缓存检查
    </text>
    <text x="75" y="40" font-family="Arial, sans-serif" font-size="10" fill="#744210" text-anchor="middle">
      Cache Check
    </text>
  </g>

  <line x1="600" y1="480" x2="650" y2="480" stroke="#f6ad55" stroke-width="2"/>

  <!-- Use Cache -->
  <g transform="translate(650, 530)">
    <rect width="120" height="40" rx="6" fill="#48bb78" opacity="0.9"/>
    <text x="60" y="17" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">命中</text>
    <text x="60" y="30" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">使用缓存</text>
  </g>
  <line x1="710" y1="510" x2="710" y2="530" stroke="#48bb78" stroke-width="2" marker-end="url(#arrowRender)"/>

  <!-- GPU Compute -->
  <g transform="translate(650, 380)">
    <rect width="120" height="40" rx="6" fill="#f56565" opacity="0.9"/>
    <text x="60" y="17" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">未命中</text>
    <text x="60" y="30" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">GPU 计算</text>
  </g>
  <line x1="710" y1="450" x2="710" y2="420" stroke="#f56565" stroke-width="2" marker-end="url(#arrowRender)"/>
  <line x1="710" y1="380" x2="710" y2="350" stroke="#f56565" stroke-width="2"/>
  <line x1="710" y1="350" x2="600" y2="350" stroke="#f56565" stroke-width="2" marker-end="url(#arrowRender)"/>

  <!-- Save Cache -->
  <line x1="710" y1="420" x2="780" y2="420" stroke="#4a5568" stroke-width="2"/>
  <g transform="translate(780, 400)">
    <rect width="100" height="40" rx="6" fill="#9f7aea" opacity="0.9"/>
    <text x="50" y="25" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">保存缓存</text>
  </g>
  <line x1="830" y1="440" x2="830" y2="550" stroke="#9f7aea" stroke-width="2"/>
  <line x1="770" y1="550" x2="830" y2="550" stroke="#9f7aea" stroke-width="2" marker-end="url(#arrowRender)"/>

  <!-- Converge paths -->
  <line x1="710" y1="570" x2="710" y2="600" stroke="#48bb78" stroke-width="2"/>
  <line x1="450" y1="590" x2="450" y2="600" stroke="#4a5568" stroke-width="2"/>
  <line x1="450" y1="600" x2="710" y2="600" stroke="#4a5568" stroke-width="2"/>
  <line x1="580" y1="600" x2="580" y2="620" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowRender)"/>

  <!-- More Layers Decision -->
  <g transform="translate(510, 620)">
    <path d="M 0,25 L 70,0 L 140,25 L 70,50 Z" fill="#fbbf24" opacity="0.9"/>
    <text x="70" y="25" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#744210" text-anchor="middle">
      更多图层?
    </text>
    <text x="70" y="38" font-family="Arial, sans-serif" font-size="9" fill="#744210" text-anchor="middle">
      More Layers?
    </text>
  </g>

  <!-- Yes - loop back -->
  <line x1="510" y1="645" x2="250" y2="645" stroke="#4a5568" stroke-width="2"/>
  <line x1="250" y1="645" x2="250" y2="400" stroke="#4a5568" stroke-width="2"/>
  <line x1="250" y1="400" x2="300" y2="400" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowRender)"/>
  <text x="280" y="640" font-family="Arial, sans-serif" font-size="10" fill="#48bb78" font-weight="bold">是 Yes</text>

  <!-- No - continue -->
  <line x1="650" y1="645" x2="720" y2="645" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowRender)"/>
  <text x="680" y="640" font-family="Arial, sans-serif" font-size="10" fill="#f56565" font-weight="bold">否 No</text>

  <!-- Post Process -->
  <g transform="translate(720, 625)">
    <rect width="150" height="40" rx="6" fill="url(#renderGrad3)" opacity="0.9"/>
    <text x="75" y="25" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">后处理 Post Process</text>
  </g>

  <line x1="795" y1="625" x2="795" y2="595" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowRender)"/>

  <!-- Color Management -->
  <g transform="translate(720, 555)">
    <rect width="150" height="40" rx="6" fill="url(#renderGrad3)" opacity="0.9"/>
    <text x="75" y="25" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">色彩管理 Color</text>
  </g>

  <line x1="795" y1="555" x2="795" y2="525" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowRender)"/>

  <!-- Output Buffer -->
  <g transform="translate(720, 485)">
    <rect width="150" height="40" rx="6" fill="url(#renderGrad3)" opacity="0.9"/>
    <text x="75" y="25" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">输出缓冲 Output</text>
  </g>

  <line x1="795" y1="485" x2="795" y2="455" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowRender)"/>

  <!-- End -->
  <g transform="translate(720, 435)">
    <ellipse cx="75" cy="20" rx="75" ry="20" fill="#48bb78" opacity="0.9"/>
    <text x="75" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      完成 Complete
    </text>
  </g>

  <!-- Side notes -->
  <g transform="translate(50, 110)">
    <rect width="230" height="140" rx="6" fill="#edf2f7"/>
    <text x="115" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2d3748" text-anchor="middle">
      性能优化 Performance
    </text>

    <circle cx="10" cy="35" r="3" fill="#48bb78"/>
    <text x="20" y="39" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">
      GPU 并行计算
    </text>

    <circle cx="10" cy="53" r="3" fill="#4299e1"/>
    <text x="20" y="57" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">
      多层缓存系统
    </text>

    <circle cx="10" cy="71" r="3" fill="#f6ad55"/>
    <text x="20" y="75" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">
      异步资源加载
    </text>

    <circle cx="10" cy="89" r="3" fill="#9f7aea"/>
    <text x="20" y="93" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">
      渲染图优化
    </text>

    <circle cx="10" cy="107" r="3" fill="#fc8181"/>
    <text x="20" y="111" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">
      智能缓存失效
    </text>

    <circle cx="10" cy="125" r="3" fill="#fbbf24"/>
    <text x="20" y="129" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">
      纹理池管理
    </text>
  </g>
</svg>
