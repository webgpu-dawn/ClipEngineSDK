<svg width="700" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="colorGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fc8181;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f6ad55;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#68d391;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowColor" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a5568" />
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Title -->
  <text x="350" y="30" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2d3748" text-anchor="middle">
    色彩管理流程 Color Management Pipeline
  </text>

  <!-- Step 1: Input -->
  <g transform="translate(30, 80)">
    <rect width="120" height="100" rx="8" fill="#e53e3e" opacity="0.85"/>
    <text x="60" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">输入色彩空间</text>
    <text x="60" y="48" font-family="Arial, sans-serif" font-size="11" fill="#fff5f5" text-anchor="middle">Input Color</text>
    <text x="60" y="63" font-family="Arial, sans-serif" font-size="10" fill="#fed7d7" text-anchor="middle">• sRGB</text>
    <text x="60" y="78" font-family="Arial, sans-serif" font-size="10" fill="#fed7d7" text-anchor="middle">• Rec.709</text>
    <text x="60" y="93" font-family="Arial, sans-serif" font-size="10" fill="#fed7d7" text-anchor="middle">• DCI-P3</text>
  </g>
  <line x1="150" y1="130" x2="190" y2="130" stroke="#4a5568" stroke-width="3" marker-end="url(#arrowColor)"/>

  <!-- Step 2: Linear Transform -->
  <g transform="translate(190, 80)">
    <rect width="120" height="100" rx="8" fill="#dd6b20" opacity="0.85"/>
    <text x="60" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">线性化</text>
    <text x="60" y="48" font-family="Arial, sans-serif" font-size="11" fill="#fffaf0" text-anchor="middle">Linearization</text>
    <text x="60" y="68" font-family="Arial, sans-serif" font-size="10" fill="#feebc8" text-anchor="middle">Gamma → Linear</text>
    <text x="60" y="83" font-family="Arial, sans-serif" font-size="9" fill="#feebc8" text-anchor="middle">γ = 2.2 or 2.4</text>
  </g>
  <line x1="310" y1="130" x2="350" y2="130" stroke="#4a5568" stroke-width="3" marker-end="url(#arrowColor)"/>

  <!-- Step 3: Working Space -->
  <g transform="translate(350, 80)">
    <rect width="120" height="100" rx="8" fill="#d69e2e" opacity="0.85"/>
    <text x="60" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">工作空间</text>
    <text x="60" y="48" font-family="Arial, sans-serif" font-size="11" fill="#fffff0" text-anchor="middle">Working Space</text>
    <text x="60" y="68" font-family="Arial, sans-serif" font-size="10" fill="#fefcbf" text-anchor="middle">Linear Rec.709</text>
    <text x="60" y="83" font-family="Arial, sans-serif" font-size="9" fill="#fefcbf" text-anchor="middle">所有渲染计算</text>
  </g>
  <line x1="470" y1="130" x2="510" y2="130" stroke="#4a5568" stroke-width="3" marker-end="url(#arrowColor)"/>

  <!-- Step 4: LUT Application -->
  <g transform="translate(510, 80)">
    <rect width="120" height="100" rx="8" fill="#38a169" opacity="0.85"/>
    <text x="60" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">LUT 应用</text>
    <text x="60" y="48" font-family="Arial, sans-serif" font-size="11" fill="#f0fff4" text-anchor="middle">LUT Transform</text>
    <text x="60" y="63" font-family="Arial, sans-serif" font-size="10" fill="#c6f6d5" text-anchor="middle">• 1D LUT</text>
    <text x="60" y="78" font-family="Arial, sans-serif" font-size="10" fill="#c6f6d5" text-anchor="middle">• 3D LUT</text>
    <text x="60" y="93" font-family="Arial, sans-serif" font-size="10" fill="#c6f6d5" text-anchor="middle">• OCIO</text>
  </g>

  <!-- Downward arrow -->
  <line x1="570" y1="180" x2="570" y2="220" stroke="#4a5568" stroke-width="3" marker-end="url(#arrowColor)"/>

  <!-- Step 5: Output Transform -->
  <g transform="translate(510, 220)">
    <rect width="120" height="100" rx="8" fill="#3182ce" opacity="0.85"/>
    <text x="60" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">输出转换</text>
    <text x="60" y="48" font-family="Arial, sans-serif" font-size="11" fill="#ebf8ff" text-anchor="middle">Output Transform</text>
    <text x="60" y="68" font-family="Arial, sans-serif" font-size="10" fill="#bee3f8" text-anchor="middle">Linear → Gamma</text>
    <text x="60" y="83" font-family="Arial, sans-serif" font-size="9" fill="#bee3f8" text-anchor="middle">色彩空间匹配</text>
  </g>
  <line x1="510" y1="270" x2="470" y2="270" stroke="#4a5568" stroke-width="3" marker-end="url(#arrowColor)"/>

  <!-- Step 6: Display -->
  <g transform="translate(350, 220)">
    <rect width="120" height="100" rx="8" fill="#5a67d8" opacity="0.85"/>
    <text x="60" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">显示输出</text>
    <text x="60" y="48" font-family="Arial, sans-serif" font-size="11" fill="#ebf4ff" text-anchor="middle">Display Output</text>
    <text x="60" y="63" font-family="Arial, sans-serif" font-size="10" fill="#c3dafe" text-anchor="middle">• 监视器</text>
    <text x="60" y="78" font-family="Arial, sans-serif" font-size="10" fill="#c3dafe" text-anchor="middle">• 导出文件</text>
    <text x="60" y="93" font-family="Arial, sans-serif" font-size="10" fill="#c3dafe" text-anchor="middle">• HDR/SDR</text>
  </g>

  <!-- Optional OCIO path -->
  <g transform="translate(30, 240)">
    <rect width="280" height="60" rx="8" fill="#805ad5" opacity="0.2" stroke="#805ad5" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="140" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#6b46c1" text-anchor="middle">
      可选：OpenColorIO (OCIO) 管线
    </text>
    <text x="140" y="43" font-family="Arial, sans-serif" font-size="10" fill="#9f7aea" text-anchor="middle">
      ACES / Filmic / AgX 等完整色彩管理方案
    </text>
  </g>

  <!-- Annotations -->
  <g transform="translate(50, 350)">
    <circle cx="0" cy="0" r="4" fill="#e53e3e"/>
    <text x="10" y="4" font-family="Arial, sans-serif" font-size="10" fill="#4a5568">输入：多种色彩空间支持</text>

    <circle cx="220" cy="0" r="4" fill="#d69e2e"/>
    <text x="230" y="4" font-family="Arial, sans-serif" font-size="10" fill="#4a5568">处理：线性空间计算</text>

    <circle cx="440" cy="0" r="4" fill="#38a169"/>
    <text x="450" y="4" font-family="Arial, sans-serif" font-size="10" fill="#4a5568">输出：目标色彩空间</text>
  </g>

  <!-- Performance note -->
  <rect x="30" y="365" width="640" height="25" rx="4" fill="#edf2f7"/>
  <text x="350" y="382" font-family="Arial, sans-serif" font-size="11" fill="#2d3748" text-anchor="middle">
    ⚡ GPU 加速处理 • 支持 16-bit/32-bit 浮点运算 • 实时预览
  </text>
</svg>
