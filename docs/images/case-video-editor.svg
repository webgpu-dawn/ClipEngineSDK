<svg width="250" height="180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="caseGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="250" height="180" rx="8" fill="#1a202c"/>

  <!-- Main viewport -->
  <rect x="10" y="10" width="160" height="120" rx="4" fill="#2d3748"/>
  <rect x="15" y="15" width="150" height="110" rx="2" fill="url(#caseGrad1)" opacity="0.7"/>

  <!-- Play button in center -->
  <circle cx="90" cy="70" r="20" fill="#ffffff" opacity="0.9"/>
  <path d="M 85,60 L 85,80 L 100,70 Z" fill="#1a202c"/>

  <!-- Timeline at bottom -->
  <rect x="10" y="140" width="230" height="30" rx="4" fill="#2d3748"/>

  <!-- Timeline tracks -->
  <rect x="15" y="145" width="60" height="8" rx="2" fill="#48bb78"/>
  <rect x="80" y="145" width="40" height="8" rx="2" fill="#f6ad55"/>
  <rect x="125" y="145" width="50" height="8" rx="2" fill="#4299e1"/>

  <rect x="15" y="157" width="80" height="8" rx="2" fill="#fc8181"/>
  <rect x="100" y="157" width="60" height="8" rx="2" fill="#9f7aea"/>

  <!-- Right panel (tools) -->
  <rect x="180" y="10" width="60" height="120" rx="4" fill="#2d3748"/>

  <!-- Tool icons -->
  <rect x="187" y="17" width="46" height="8" rx="2" fill="#4a5568"/>
  <rect x="187" y="30" width="46" height="8" rx="2" fill="#4a5568"/>
  <rect x="187" y="43" width="46" height="8" rx="2" fill="#4a5568"/>
  <rect x="187" y="56" width="46" height="8" rx="2" fill="#4a5568"/>

  <!-- Sliders -->
  <line x1="190" y1="75" x2="230" y2="75" stroke="#718096" stroke-width="2"/>
  <circle cx="220" cy="75" r="3" fill="#4299e1"/>

  <line x1="190" y1="88" x2="230" y2="88" stroke="#718096" stroke-width="2"/>
  <circle cx="210" cy="88" r="3" fill="#48bb78"/>

  <line x1="190" y1="101" x2="230" y2="101" stroke="#718096" stroke-width="2"/>
  <circle cx="200" cy="101" r="3" fill="#f6ad55"/>

  <!-- Title overlay -->
  <rect x="0" y="0" width="250" height="30" fill="#1a202c" opacity="0.85"/>
  <text x="125" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
    专业视频编辑器
  </text>
</svg>
