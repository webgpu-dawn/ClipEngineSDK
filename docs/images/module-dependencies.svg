    </text>

    <line x1="20" y1="35" x2="70" y2="35" stroke="#718096" stroke-width="2" marker-end="url(#arrowMod)"/>
    <text x="80" y="39" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">
      直接依赖
    </text>

    <line x1="20" y1="55" x2="70" y2="55" stroke="#718096" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowMod)"/>
    <text x="80" y="59" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">
      间接依赖
    </text>

    <rect x="20" y="70" width="50" height="20" rx="4" fill="url(#modGrad1)" opacity="0.9"/>
    <text x="80" y="83" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">
      核心模块
    </text>

    <rect x="20" y="95" width="50" height="20" rx="4" fill="url(#modGrad2)" opacity="0.9"/>
    <text x="80" y="108" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">
      业务模块
    </text>

    <rect x="20" y="120" width="50" height="20" rx="4" fill="url(#modGrad3)" opacity="0.9"/>
    <text x="80" y="133" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">
      子系统
    </text>
  </g>

  <!-- Module count -->
  <text x="450" y="565" font-family="Arial, sans-serif" font-size="11" fill="#718096" text-anchor="middle">
    总模块数: 12 • 核心依赖: Core Engine • 跨平台支持: 4 个 GPU 后端
  </text>
</svg>
