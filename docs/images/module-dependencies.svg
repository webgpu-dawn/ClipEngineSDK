<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="modGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="modGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#48bb78;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38a169;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="modGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4299e1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3182ce;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowMod" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#718096" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="30" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2d3748" text-anchor="middle">
    模块依赖关系 Module Dependencies
  </text>

  <!-- Core Engine (bottom center) -->
  <g transform="translate(350, 500)">
    <rect width="200" height="80" rx="8" fill="url(#modGrad1)" opacity="0.9"/>
    <text x="100" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
      Core Engine
    </text>
    <text x="100" y="48" font-family="Arial, sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">
      核心引擎
    </text>
    <text x="100" y="63" font-family="Arial, sans-serif" font-size="9" fill="#cbd5e0" text-anchor="middle">
      内存 • 线程 • 数学库
    </text>
  </g>

  <!-- Layer 2: Basic Systems -->
  <g transform="translate(50, 380)">
    <rect width="140" height="60" rx="6" fill="url(#modGrad2)" opacity="0.9"/>
    <text x="70" y="30" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
