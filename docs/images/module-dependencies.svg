  <g transform="translate(670, 60)">
    <rect width="200" height="140" rx="6" fill="#edf2f7"/>
    <text x="100" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2d3748" text-anchor="middle">
