    <text x="85" y="56" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">WebGPU</text>

    <rect x="160" y="35" width="110" height="35" rx="4" fill="#ed8936" opacity="0.8"/>
    <text x="215" y="56" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">DirectX 12</text>

    <rect x="290" y="35" width="110" height="35" rx="4" fill="#ed8936" opacity="0.8"/>
    <text x="345" y="56" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Metal</text>

    <rect x="420" y="35" width="110" height="35" rx="4" fill="#ed8936" opacity="0.8"/>
    <text x="475" y="56" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Vulkan</text>
  </g>

